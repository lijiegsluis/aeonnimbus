name: Refresh research feed

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Substack RSS into research-feed.json
        run: python3 .github/scripts/refresh_feed.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- research-feed.json; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-feed.json
          git commit -m "chore: refresh research feed snapshot"
          git push
